[project]
name = "hw1-ai-service"
version = "0.1.0"
description = "CM5-side AI companion for hardwareone: STT + LLM over the UART link"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# STT engines are optional so the package installs (and tests run) anywhere;
# install the one the config selects on the Pi.
moonshine = ["moonshine-voice"]
zipformer = ["sherpa-onnx"]
dev = ["pytest>=8.0"]

[project.scripts]
hw1-ai-service = "hw1_ai_service.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hw1_ai_service*"]

[tool.pytest.ini_options]
markers = ["slow: long-running soak tests (deselect with '-m \"not slow\"')"]
